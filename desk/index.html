<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>작업실</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://maker-ssam.github.io/korean-ofl-fonts/fonts/pretendard/pretendard.css">
<link rel="stylesheet" href="../style.css">
<style>
  .lock { max-width: 360px; margin: 0 auto; padding: 120px 0 64px; }
  .lock h1 { margin: 0 0 20px; font-size: 24px; font-weight: 700; }
  .lock form { display: flex; gap: 8px; }
  .lock input, .lock button {
    font: inherit; font-size: 16px; padding: 10px 14px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text);
  }
  .lock input { flex: 1; min-width: 0; }
  .lock button { cursor: pointer; }
  .lock button:hover, .lock input:focus { border-color: var(--accent); outline: none; }
  .lock .msg { min-height: 1.6em; margin: 10px 0 0; color: var(--muted); font-size: 14px; }
  .desk h1 { margin: 0; padding: 72px 0 8px; font-size: 32px; font-weight: 800; }
  .links { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .links a {
    display: block; padding: 14px 16px; text-decoration: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .links a:hover, .links a:focus-visible { border-color: var(--accent); }
  .links b { display: block; font-weight: 700; }
  .links span { display: block; margin-top: 2px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="lock" id="lock">
    <h1>🔒 작업실</h1>
    <form id="f">
      <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" autofocus>
      <button>열기</button>
    </form>
    <p class="msg" id="msg"></p>
  </div>
  <div class="desk" id="desk" hidden></div>
</div>

<script>
// 링크 목록은 아래에 암호화되어 있다. 원본과 만드는 법은 OneDrive Claude-code/desk/ (공개 저장소 밖)
const BOX = {"iter":600000,"salt":"r8MSceMs9644LAibfXfX8Q==","iv":"C8TYtVVKnn3OP6Ds","ct":"m/IL5VIfret+76trFgvg0lZXqdjfOHiwwXBuPbcQDFNsJvILHILpLF2gCB6yYT509aexHfsszRrhU6V8XE/2dEewaMazYGWZPO3FTLUKk/aVmKP/rfkuByaGfbhuBBqFE+C+HDfTxf+DOEVIbDSs3+j10HYtBJr5b/eJStbZAEYfUVcUeCJSbiLMc74RKVbWkcVp+RhtwLPhA4Cdx4lzo4UJnH2Ur2sGSrdpERfTFd12sdAoXvZRNbQ+j6xZC+BtKoK+zAe+q9vKsCQZUqaP3foxqQ5vjD8xC0YGR7XCnAcWXgyFHogvsVjHE1bxb5Kx9jhxFWmRNFqjc3UplwN/7OgoolZWvk6ozoqRmdsL8/5HD0mi4Elk164+C4Smy3lx3ynMx1wMEtzxDicAqXdZO3b5rdipQdfXpdBBUCNP0ayCdmmaT815N70RgjKsjL6rQ0SK66Td5PvMzdFtTNP1VZjgKj0dIxNDsdyAKvr8IF7vxFccUZFjrgpgrrvhZ2bGjDrPCDIQrSm1+3q42xbaaJdFKTIMD5AsmsIw9uC5JvY676UCuq7ayRgwzIWygPW4JsZBoW+1VnT8sJuvJy234gAxW5YoX1LDKWTv7LUXZ3mK2AN+RTGV9eRy+15O9DrVESMpBy+fuQwgoopTXi7OUNgw64QO35lhAB3krWiy00fS6FNV2nsvDc0t4w0hFpYdSX2GxhxgcP623Knkefd1QI1oUlulVySpZAo8hcczDBKfCdOOfm39OG3Jp1dJG5IackrKuiDG7zqO2K68MLDZnoyjkbx7x8U+2HRGCy3AMcrzZ5/nRyYsaMVRSwn83PVS2jaJBb1Q7x1NYGnzmGhVs2125EsDPIKomCnR4e3RsZ5+gJ45ech1ydHm5hPgdPIhvAN6eRzGadblNDDIVeRaZT4DreWkBw=="};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };

async function open(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(BOX.salt), iterations: BOX.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(BOX.iv) }, key, b64(BOX.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

function show(d) {
  const desk = document.getElementById('desk');
  desk.append(el('h1', '', d.title || '작업실'));
  (d.groups || []).forEach(g => {
    const s = el('section'); s.append(el('h2', '', g.title));
    const box = el('div', 'links');
    (g.links || []).forEach(l => {
      const a = el('a'); a.href = l.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.append(el('b', '', l.label));
      if (l.note) a.append(el('span', '', l.note));
      box.append(a);
    });
    s.append(box); desk.append(s);
  });
  document.getElementById('lock').hidden = true;
  desk.hidden = false;
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '여는 중…';
  try { show(await open(document.getElementById('pw').value)); }
  catch { msg.textContent = '비밀번호가 맞지 않아요.'; }
});
</script>
</body>
</html>
