<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>작업실</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://maker-ssam.github.io/korean-ofl-fonts/fonts/pretendard/pretendard.css">
<link rel="stylesheet" href="../style.css">
<style>
  .lock { max-width: 360px; margin: 0 auto; padding: 120px 0 64px; --field-line: var(--line); }
  @media (prefers-color-scheme: dark) { .lock { --field-line: #48484e; } }
  .lock h1 { margin: 0 0 20px; font-size: 24px; font-weight: 700; }
  .lock form { display: flex; gap: 8px; }
  .lock input, .lock button {
    font: inherit; font-size: 16px; padding: 10px 14px;
    border: 1px solid var(--field-line); border-radius: 10px; background: var(--surface); color: var(--text);
  }
  .lock input { flex: 1; min-width: 0; }
  .lock button { cursor: pointer; }
  .lock button:hover, .lock input:focus { border-color: var(--accent); }
  .lock input:focus-visible, .lock button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lock .msg { min-height: 1.6em; margin: 10px 0 0; color: var(--muted); font-size: 14px; }
  .desk h1 { margin: 0; padding: 72px 0 8px; font-size: 32px; font-weight: 800; }
  .links { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .links a {
    display: block; padding: 14px 16px; text-decoration: none;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .links a:hover, .links a:focus-visible { border-color: var(--accent); }
  .links b { display: block; font-weight: 700; }
  .links span { display: block; margin-top: 2px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="lock" id="lock">
    <h1>🔒 작업실</h1>
    <form id="f">
      <input type="password" id="pw" placeholder="비밀번호" aria-label="비밀번호" autocomplete="current-password" autofocus>
      <button>열기</button>
    </form>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </div>
  <div class="desk" id="desk" hidden></div>
</div>

<script>
// 링크 목록은 아래에 암호화되어 있다. 원본과 만드는 법은 OneDrive Claude-code/desk/ (공개 저장소 밖)
const BOX = {"iter":600000,"salt":"FmkTik+9yBQz2r2VrTlqzg==","iv":"gg0RNQkVh8/zr10J","ct":"QkKUJTS/NVeCKuD/NSgG+Tpq1+BRfn0bcAzX1Ddwy7Nf2Sa0USLRnu46SLpWdjfAsNsY+cGLiV30Idtr0LfPvsITCYAVNxAKMJh5yg73ylZBeyZlI7hr6aA63HjOYfhUYF7OsxNurfB7g3Ist4RuxL78cLGvZwKkHQOIi3hyUqEyZc60E7yLgf5+sp6Md4ezBvTg/eNAocNcL0omneacF14zMTNQsYEsKqc+fnQGPvR2zaQoMCWOktfWoPigCzIGX+R4s9gR4BwuyxVhYRE3S+2nsxeubFteyDx7P6UlskVO+GFcCU4anut4qUJhtqmd+44kLp+QrfXFAxEDCQvITHn8REmaX3qccCM8VFDtWWYda4sVigy0SyBTB3T+JYyOKaR+kztATvMREqN/TeYzzeK8VT8tO5WHg9LiefhN814vCT2N8vO9Ba87p4G84wRcrsl2af7fN1r3fQygsS9t3/1kLuOhBvOABtxbL5C51mBraMZQXCKRR1qPIM/F63PjB88OHFjnQWFlHPCFSxZhCERCHLnU3lUPrfrYhu3qOnyXaxv6e7cmcJqdAwJu1XC+UYD42/6EmKBGHLYEE5TyFhXshuE855ftcJJFp1+NP93VEjMjFeuWBDCqS+CIcwXCNy8T3wQaAH7TD4rwvhoEo10u+G3eU4ukdqTBgTMUXQ7BVilnzcgCo4XuZaK81r6AsAmJwP3xKY+3G9clyVgWleItEO5qpEpbILUlbY3HOaISuSgCfavxgLCWAGzczj84jr51vVb3GN3bteRGy90zwY4r2raDHmJkjta7RBd90zny3coTcCwAUPWBx26qDMR3Lh641A4bBL5TSD3In6KHUmSuqMhRFg3eys6lgQzMIanlBwtdHtkqEVlhWDlI9mjP1rr7ZtLIlVJTER44gvTl3FqVaHUNJw=="};
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };

async function open(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(BOX.salt), iterations: BOX.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(BOX.iv) }, key, b64(BOX.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

function show(d) {
  const desk = document.getElementById('desk');
  desk.append(el('h1', '', d.title || '작업실'));
  (d.groups || []).forEach(g => {
    const s = el('section'); s.append(el('h2', '', g.title));
    const box = el('div', 'links');
    (g.links || []).forEach(l => {
      const a = el('a'); a.href = l.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.append(el('b', '', l.label));
      if (l.note) a.append(el('span', '', l.note));
      box.append(a);
    });
    s.append(box); desk.append(s);
  });
  document.getElementById('lock').hidden = true;
  desk.hidden = false;
}

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '여는 중…';
  try { show(await open(document.getElementById('pw').value)); }
  catch { msg.textContent = '비밀번호가 맞지 않아요.'; }
});
</script>
</body>
</html>
